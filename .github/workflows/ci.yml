name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: linux-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DSA_BUILD_GUI=OFF -DSA_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r simulator/requirements.txt -r tools/requirements.txt
      - name: End-to-end smoke test (simulator -> sa_cli)
        run: |
          cmake -S . -B build -DSA_BUILD_GUI=OFF -DSA_BUILD_TESTS=OFF
          cmake --build build --parallel
          python simulator/sensor_sim.py --duration 6 --tones 120:1 --seed 1 &
          ./build/sa_cli --seconds 5 | tee cli.log
          tail -1 cli.log | grep -E "f_dom=1(19|20)\.[0-9]+ Hz"
      - name: End-to-end envelope analysis (simulated bearing fault at 87 Hz)
        run: |
          python simulator/sensor_sim.py --duration 6 --fault-hz 87 --fault-amp 0.3 --seed 1 &
          ./build/sa_cli --seconds 5 | tee env.log
          tail -1 env.log | grep -E "f_dom=50\.[0-9]+ Hz"     # raw spectrum: rotation tone
          tail -1 env.log | grep -E "f_env=8[67]\.[0-9]+ Hz"  # envelope: impact rate
      - name: End-to-end bearing diagnosis (SKF 6205 at 3000 rpm, outer race, 1 % slip)
        run: |
          python simulator/sensor_sim.py --duration 6 --fault-hz 177.5 --fault-amp 0.3 --seed 1 &
          ./build/sa_cli --rpm 3000 --seconds 5 | tee bearing.log
          tail -1 bearing.log | grep -E "match=BPFO 1x"
      - name: End-to-end multi-channel (3 channels, bearing fault on channel 1 only)
        run: |
          python simulator/sensor_sim.py --duration 6 --channels 3 --gains 1,0.5,0.25 \
            --fault-hz 177.5 --fault-amp 0.3 --fault-channel 1 --seed 1 &
          ./build/sa_cli --rpm 3000 --seconds 5 | tee multi.log
          tail -3 multi.log | grep -E "^ch=1 .*match=BPFO 1x"
          tail -3 multi.log | grep -E "^ch=0 .*match=-"
          tail -3 multi.log | grep -E "^ch=2 .*match=-"
      - name: End-to-end recording, CSV / HDF5 conversion and replay
        run: |
          # Live, 2 channels with 5 % packet loss, recorded to a capture file
          python simulator/sensor_sim.py --duration 6 --channels 2 --fault-hz 177.5 --fault-amp 0.3 \
            --fault-channel 1 --drop 0.05 --seed 3 &
          ./build/sa_cli --record run.sacap --seconds 5
          python tools/sacap.py info run.sacap
          python tools/sacap.py to-csv run.sacap run.csv
          python tools/sacap.py to-hdf5 run.sacap run.h5
          python tools/sacap.py from-hdf5 run.h5 from_h5.sacap
          python tools/sacap.py from-csv run.csv from_csv.sacap
          # Replays analyse identically, lost packets included
          ./build/sa_cli --replay run.sacap --speed 0 --rpm 3000 | tail -2 | tee original.log
          ./build/sa_cli --replay from_h5.sacap --speed 0 --rpm 3000 | tail -2 > from_h5.log
          ./build/sa_cli --replay from_csv.sacap --speed 0 --rpm 3000 | tail -2 > from_csv.log
          grep -E "^ch=1 .*match=BPFO 1x" original.log
          diff original.log from_h5.log
          diff original.log from_csv.log
      - name: End-to-end fatigue life (pure 50 Hz sine, 100 MPa range, 2e6 cycles at 100 MPa)
        run: |
          # 50 cycles/s at the reference range: life = 2e6 / 50 s = 11.1 h
          python simulator/sensor_sim.py --duration 6 --tones 50:1 --noise 0 --seed 1 &
          ./build/sa_cli --stress-scale 50 --sn 3:100:2e6 --seconds 5 | tee fatigue.log
          tail -1 fatigue.log | grep -E "life=11\.1 h"
          # Static offset 0.5 = 25 MPa mean; Goodman with Rm = 100 MPa scales the range
          # by 1 / (1 - 0.25), the damage by (4/3)^3: life = 11.1 h / 2.37 = 4.7 h
          python simulator/sensor_sim.py --duration 6 --tones 50:1 --noise 0 --offset 0.5 --seed 1 &
          ./build/sa_cli --stress-scale 50 --sn 3:100:2e6 --mean-stress goodman:100 --seconds 5 | tee goodman.log
          tail -1 goodman.log | grep -E "life=4\.7 h"
