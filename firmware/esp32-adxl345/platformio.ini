; ESP32 + ADXL345 vibration sensor for Signal Analyzer.
; Build and flash:  pio run -e <env> -t upload    Serial log:  pio device monitor
; See README.md in this directory.

[platformio]
; The board you flash by default. The upload stops with "This chip is ESP32-S3,
; not ESP32" (or the other way round) if this does not match the board.
default_envs = esp32s3

[env]
platform = espressif32 @ ~8.0.0   ; Arduino-ESP32 3.3; the version this was built with
framework = arduino
monitor_speed = 115200
upload_speed = 921600             ; lower to 460800 or 115200 if uploads fail
build_flags = -Wall -Wextra

; ESP32-S3 boards: YD-ESP32-S3 / YD-ESP32-23, ESP32-S3-DevKitC-1.
; Connect the USB port labelled COM (the USB-serial chip) for upload and the serial log.
[env:esp32s3]
board = esp32-s3-devkitc-1

; Classic ESP32 boards with an ESP32-WROOM-32 module: ESP32 DevKit V1 and similar.
[env:esp32]
board = esp32dev
