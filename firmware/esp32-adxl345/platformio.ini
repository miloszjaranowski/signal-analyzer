; ESP32 + ADXL345 vibration sensor for Signal Analyzer.
; Build and flash:  pio run -t upload    Serial log:  pio device monitor
; See README.md in this directory.

[env:esp32dev]
platform = espressif32 @ ~8.0.0   ; Arduino-ESP32 3.3; the version this was built with
board = esp32dev            ; ESP32-WROOM-32 boards: DevKit V1, YD-ESP32-23 and similar
framework = arduino
monitor_speed = 115200
upload_speed = 921600       ; lower to 460800 or 115200 if uploads fail
build_flags = -Wall -Wextra
